name: daily
# Every morning (New York time): pull the newest 311 data, rebuild the dashboard files, commit them.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Re-pull this many days of counts (0 = normal run; the first run takes two years)"
        default: "0"
permissions:
  contents: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Pull and rebuild
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: pulse update --backfill "${{ github.event.inputs.backfill || '0' }}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "311 data through $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && break; sleep 5; done
