[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-311-pulse"
version = "1.0.0"
description = "A daily pulse of New York City 311 service requests: what is unusual today, trends, and how fast agencies close requests."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ashok Reddy" }]
requires-python = ">=3.11"
dependencies = ["pandas>=2.0"]
keywords = ["nyc", "311", "open data", "civic analytics", "anomaly detection"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Database",
  "Intended Audience :: Developers",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "pandas-stubs"]

[project.scripts]
pulse = "pulse.cli:main"

[project.urls]
Homepage = "https://github.com/AshokReddy010/nyc-311-pulse"
Dashboard = "https://ashokreddy010.github.io/nyc-311-pulse/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B023"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
